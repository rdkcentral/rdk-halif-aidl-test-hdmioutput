    # SPD InfoFrame Transmission Test
    # User action: Optional - verify on HDMI analyzer
    SPDInfoFrameTransmission:
      ports:
        - id: 0  # IHDMIOutput.Id
          spd_info:
            vendor_name: "RDK"
            product_description: "Test Device"
            source_information: DIGITAL_STB  # Possible: DIGITAL_STB, DVD_PLAYER, etc.
          max_wait_time_ms: 5000

    # Property Application Verification Test
    # User action: Optional - verify AVI InfoFrame on HDMI analyzer
    PropertyApplicationVerification:
      ports:
        - id: 0  # IHDMIOutput.Id
          test_properties:
            - property: VIC
              value: [4, 16, 97]  # Actual VIC values to test
            - property: CONTENT_TYPE
              value: [0, 1, 2]  # Actual content type values (e.g., 0=NONE, 1=GRAPHICS, 2=PHOTO, 3=CINEMA)
            - property: AFD
              value: [9, 8, 11]  # Actual AFD values
            - property: HDR_OUTPUT_MODE
              value: [0, 1, 2]  # Actual HDR mode values (e.g., 0=OFF, 1=HDR10, 2=HLG, etc.)
            - property: SCAN_INFORMATION
              value: [0, 1, 2]  # Actual scan info values (e.g., 0=NO_DATA, 1=OVERSCAN, 2=UNDERSCAN)
          max_wait_time_ms: 5000

    # Video Playback Event Verification Test
    # User action: Optional - verify InfoFrames on HDMI analyzer
    VideoPlaybackEventVerification:
      ports:
        - id: 0  # IHDMIOutput.Id
          max_wait_time_ms: 1000
